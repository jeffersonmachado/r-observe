name: release-hardening

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            r-observe/discovery/package-lock.json

      - name: Clean dist
        run: npm run dist:clean:release

      - name: Enterprise hardened release pipeline
        run: npm run release:ci:hardened

      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-hardening-reports
          path: |
            dist/*manifest*
            dist/*provenance*
            dist/*attestation*
            dist/*validate*
            dist/*smoke*
            dist/*gate*
            dist/*audit*
            dist/*timing*
            dist/*zip.log
            dist/*.sha256
