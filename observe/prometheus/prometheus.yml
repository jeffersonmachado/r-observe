global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    product: 'r-observe'
    environment: 'production'

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:

  # R-Observe API
  - job_name: 'r-observe-api'
    metrics_path: '/observe/api/metrics'
    static_configs:
      - targets: ['r-observe-api:3000']
        labels:
          service: 'r-observe-api'

  # R-Observe Worker
  - job_name: 'r-observe-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['r-observe-worker:3000']
        labels:
          service: 'r-observe-worker'

  # R-Observe AI
  - job_name: 'r-observe-ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['r-observe-ai:3000']
        labels:
          service: 'r-observe-ai'

  # R-Observe Agent
  - job_name: 'r-observe-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['r-observe-agent:3000']
        labels:
          service: 'r-observe-agent'

  # R-Observe Discovery
  - job_name: 'r-observe-discovery'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['r-observe-discovery:3010']
        labels:
          service: 'r-observe-discovery'

  # Prometheus self-scrape
  - job_name: 'prometheus'
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['localhost:9090']

  # Grafana (métricas nativas em /grafana/metrics)
  - job_name: 'observe-grafana'
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ['r-observe-grafana:3000']
        labels:
          service: 'observe-grafana'

  # PostgreSQL
  - job_name: 'observe-postgres'
    static_configs:
      - targets: ['r-observe-postgres-exporter:9187']
        labels:
          service: 'observe-postgres'

  # Redis
  - job_name: 'observe-redis'
    static_configs:
      - targets: ['r-observe-redis-exporter:9121']
        labels:
          service: 'observe-redis'

  # OTel Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['r-observe-otel-collector:8888']
        labels:
          service: 'otel-collector'

  # ── HTTP SD: targets dinâmicos via R-Observe API ─────────────────────────────
  # A API expõe /observe/api/sd/targets com hosts/serviços conhecidos no DB.
  # Atualiza a cada 30s sem restart do Prometheus.
  - job_name: 'discovered-http-sd'
    http_sd_configs:
      - url: 'http://r-observe-api:3000/observe/api/sd/targets'
        refresh_interval: 30s
    relabel_configs:
      # Mantém apenas targets com porta de exporter reconhecida
      - source_labels: [__address__]
        regex: '.+:(9100|9104|9108|9115|9117|9121|9187|9256|9419|9090|9091)'
        action: keep
      - source_labels: [job]
        target_label: job

  # ── HTTP SD Discovery Engine ───────────────────────────────────────────────
  - job_name: 'discovery-engine-http-sd'
    http_sd_configs:
      - url: 'http://r-observe-discovery:3010/api/discovery/prometheus/http-sd'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [job]
        target_label: job

  # ── File SD: targets descobertos pelo discover-hosts.sh --mode prometheus-sd ──
  # Gerado em observe/prometheus/sd/discovered.json pelo script de descoberta.
  # Atualiza a cada 60s — basta re-executar o script sem restart.
  - job_name: 'discovered-file-sd'
    file_sd_configs:
      - files: ['/etc/prometheus/sd/*.json']
        refresh_interval: 60s
    relabel_configs:
      - source_labels: [discovered]
        regex: 'true'
        action: keep
      # Preserva job e host dos labels do SD JSON
      - source_labels: [job]
        target_label: job
      - source_labels: [host]
        target_label: host

  # ── SNMP Exporter: métricas de camada física (L1) ───────────────────────
  - job_name: 'snmp-exporter'
    scrape_interval: 60s
    scrape_timeout: 30s
    file_sd_configs:
      - files: ['/etc/prometheus/sd/*.json']
        refresh_interval: 120s
    relabel_configs:
      - source_labels: [job]
        regex: 'snmp-exporter'
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: 'r-observe-snmp-exporter:9116'
    metric_relabel_configs:
      - source_labels: [ifDescr]
        target_label: interface
      - source_labels: [ifName]
        target_label: interface_name
      - source_labels: [ifType]
        target_label: interface_type

  # ── Exporters estáticos (sidecars na mesma rede Docker) ─────────────────
  - job_name: 'redis-exporter-static'
    scrape_interval: 30s
    static_configs:
      - targets: ['r-observe-redis-exporter:9121']
        labels:
          service: 'redis'

  - job_name: 'postgres-exporter-static'
    scrape_interval: 30s
    static_configs:
      - targets: ['r-observe-postgres-exporter:9187']
        labels:
          service: 'postgres'

  - job_name: 'prometheus-self'
    scrape_interval: 30s
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['localhost:9090']
