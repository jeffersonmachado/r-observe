/**
 * R-Observe: checks de serviços de e-mail e web.
 *
 * Ativados por variáveis definidas no host (manualmente ou via
 * scripts/observe/discover-hosts.sh). Referência de vars:
 *
 *   vars.smtp_port            → SMTP (geralmente 25)
 *   vars.smtp_submission_port → SMTP Submission (587)
 *   vars.smtp_tls_port        → SMTPS implícito (465)
 *   vars.imap_port            → IMAP (143)
 *   vars.imaps_port           → IMAPS (993)
 *   vars.pop3s_port           → POP3S (995)
 *   vars.check_rspamd         → HTTP check na UI rspamd (11334)
 *   vars.http_vhosts          → dict de checks HTTP (padrão do Icinga2)
 *   vars.os = "Linux"         → ativa check SSH (padrão do Icinga2)
 */

/* ── SMTP ───────────────────────────────────────────────────────────────────── */
apply Service "smtp" to Host {
  import "generic-service"
  display_name  = "SMTP"
  check_command = "smtp"
  vars.smtp_port    = host.vars.smtp_port
  vars.smtp_address = host.address
  assign where host.vars.smtp_port
}

apply Service "smtp-submission" to Host {
  import "generic-service"
  display_name  = "SMTP Submission"
  check_command = "smtp"
  vars.smtp_port    = host.vars.smtp_submission_port
  vars.smtp_address = host.address
  assign where host.vars.smtp_submission_port
}

/* SMTPS implícito (465) — TCP check porque o plugin smtp não suporta TLS implícito */
apply Service "smtps" to Host {
  import "generic-service"
  display_name  = "SMTPS"
  check_command = "tcp"
  vars.tcp_port    = host.vars.smtp_tls_port
  vars.tcp_address = host.address
  assign where host.vars.smtp_tls_port
}

/* ── IMAP ───────────────────────────────────────────────────────────────────── */
apply Service "imap" to Host {
  import "generic-service"
  display_name  = "IMAP"
  check_command = "imap"
  vars.imap_port    = host.vars.imap_port
  vars.imap_address = host.address
  assign where host.vars.imap_port
}

/* IMAPS (993) — TCP check (plugin imap não suporta TLS implícito) */
apply Service "imaps" to Host {
  import "generic-service"
  display_name  = "IMAPS"
  check_command = "tcp"
  vars.tcp_port    = host.vars.imaps_port
  vars.tcp_address = host.address
  assign where host.vars.imaps_port
}

/* ── POP3S ──────────────────────────────────────────────────────────────────── */
apply Service "pop3s" to Host {
  import "generic-service"
  display_name  = "POP3S"
  check_command = "tcp"
  vars.tcp_port    = host.vars.pop3s_port
  vars.tcp_address = host.address
  assign where host.vars.pop3s_port
}

/* ── RSPAMD ─────────────────────────────────────────────────────────────────── */
apply Service "rspamd" to Host {
  import "generic-service"
  display_name  = "rspamd"
  check_command = "http"
  vars.http_port    = 11334
  vars.http_uri     = "/"
  vars.http_address = host.address
  assign where host.vars.check_rspamd
}
