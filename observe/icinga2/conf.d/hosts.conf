/**
 * Hosts monitorados pelo R-Observe stack.
 * Usa nomes de container (DNS interno do Docker) — resistente a mudanças de IP.
 * Sincronizado com IcingaDB em 2026-06-03.
 */

object Host "observe-api" {
  import "generic-host"
  address       = "r-observe-api"
  display_name  = "R-Observe API"
  check_command = "hostalive"
  vars.http_vhosts["health"] = {
    http_uri  = "/observe/api/health"
    http_port = 3000
  }
}

