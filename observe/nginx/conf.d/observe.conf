server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # Resolver interno do Docker — resolve upstreams em tempo de requisição,
    # não no startup, permitindo que o nginx suba mesmo com serviços opcionais ausentes.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstreams definidos como variáveis para resolução em runtime
    set $api_upstream "r-observe-api:3000";
    set $discovery_upstream "r-observe-discovery:3010";
    set $icingaweb_upstream "r-observe-icingaweb2:8080";
    set $grafana_upstream "r-observe-grafana:3000";
    set $prometheus_upstream "r-observe-prometheus:9090";

    # /observe/api → R-Observe API
    location /observe/api/ {
        limit_req zone=observe_api burst=50 nodelay;

        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # Rate limit extra em endpoints de eventos
    location ~ ^/observe/api/(events|icinga/events) {
        limit_req zone=observe_events burst=20 nodelay;

        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /observe/settings → UI de configuração do provider de IA
    location = /observe/ai {
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /observe/settings {
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /observe/home {
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /observe/login {
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /observe/discovery/api/* -> ROTEADO via r-observe-api (autenticado)
    # O API proxy gerencia sessao, RBAC e repassa com X-Internal-Token para o discovery.
    location /observe/discovery/api/ {
        limit_req zone=observe_api burst=50 nodelay;

        rewrite ^/observe/discovery/api/(.*)$ /observe/api/$1 break;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # /observe/discovery -> API (autenticado, redireciona para login sem sessao)
    location = /observe/discovery {
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # /observe/discovery/data/summary e /data/scopes -> API proxy (autenticado)
    # Evita que o usuario precise preencher token interno na UI.
    location ~ ^/observe/discovery/data/(summary|scopes) {
        limit_req zone=observe_api burst=50 nodelay;

        rewrite ^/observe/discovery/data/(.*)$ /observe/api/data/$1 break;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # /observe/discovery/data/* (estaticos) -> Discovery direto
    location /observe/discovery/data/ {
        proxy_pass         http://$discovery_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /icinga → IcingaWeb2 (opcional — retorna 502 se o perfil icinga não estiver ativo)
    # IcingaWeb2 — proxy com rewrite de path, redirects e reescrita de hrefs HTML
    location /icinga/ {
        rewrite ^/icinga/(.*)$ /$1 break;
        proxy_pass            http://$icingaweb_upstream;
        proxy_http_version    1.1;
        proxy_set_header      Host              $http_host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Forwarded-Host  $host;
        proxy_set_header      X-Forwarded-Port  $server_port;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        # Reescreve Location headers: /foo → http://host:port/icinga/foo
        proxy_redirect        ~^/(?!icinga/)(.*)$ $scheme://$http_host/icinga/$1;
        # Reescreve hrefs/actions no HTML para incluir /icinga/ (form action, links, etc.)
        proxy_set_header      Accept-Encoding "";
        # Favicon e branding — aplicados ANTES da reescrita de href/src
        sub_filter            '</head>' '<style>#login{background:radial-gradient(ellipse at 50% 60%,#1a0005 0%,#06062b 100%)!important}#login::before{content:"";position:fixed;width:55vw;height:55vw;max-width:900px;border-radius:50%;background:radial-gradient(circle,rgba(204,18,18,.18) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}#login .orb{display:none!important}#login ul{display:none!important}#login input[type=submit]{background:#CC1212!important;border-color:#CC1212!important}#login input[type=submit]:hover{background:#a80e0e!important}#login input[type=submit]:focus{outline-color:rgba(204,18,18,.5)!important}#login input[type=text]:focus,#login input[type=password]:focus{border-color:#CC1212!important;box-shadow:0 0 0 2px rgba(204,18,18,.2)!important}.logo-wrapper::before{content:"Results \00B7 Sistemas de Inform\00E1tica";display:block;text-align:center;color:#CC1212;font-size:.72em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5em;font-family:Segoe UI,Arial,sans-serif}</style></head>';
        sub_filter            'img/website-icon.svg' 'results-brand/favicon.svg';
        sub_filter            'img/favicon.png' 'results-brand/favicon.svg';
        sub_filter            'img/touch-icon.png' 'results-brand/favicon.svg';
        sub_filter            'color="#0096BF"' 'color="#CC1212"';
        sub_filter            'Icinga Web 2' 'R-Observe Monitor';
        sub_filter            'icinga.com' 'results.com.br';
        sub_filter            'Stay logged in' 'Permanecer conectado';
        sub_filter            'Welcome to Icinga Web 2. For users of the screen reader Jaws full and expectant compliant accessibility is possible only with use of the Firefox browser. VoiceOver on Mac OS X is tested on Chrome, Safari and Firefox.' 'Bem-vindo ao R-Observe Monitor. Para usuários do leitor de tela Jaws, acessibilidade completa é possível apenas com Firefox. VoiceOver no Mac OS X é testado no Chrome, Safari e Firefox.';
        sub_filter_once       off;
        sub_filter_types      text/html application/javascript application/json text/css text/plain;
        # Reescrita de href/src (depois do branding)
        sub_filter            'action="/'    'action="/icinga/';
        sub_filter            'href="/'      'href="/icinga/';
        sub_filter            'src="/'       'src="/icinga/';
        sub_filter            'href="http://$host/icinga/' 'href="https://$host/icinga/';
        sub_filter            'src="http://$host/icinga/'  'src="https://$host/icinga/';
    }

    # Assets estáticos da marca Results (favicon, logos)
    location /results-brand/ {
        alias /etc/nginx/results-brand/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /icinga/results-brand/ {
        alias /etc/nginx/results-brand/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Catch-all para paths do IcingaWeb2 sem /icinga/ (form submits diretos)
    location ~ ^/(authentication|dashboard|monitoring|icingadb|layout|application-state|img|css|js|font)(/|$) {
        return 307 /icinga$request_uri;
    }

    # /grafana → Grafana (opcional — retorna 502 se o perfil monitoring não estiver ativo)
    location /grafana/ {
        proxy_pass         http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # /prometheus → Prometheus (monitoring)
    location /prometheus/ {
        proxy_pass         http://$prometheus_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Health do próprio proxy
    location /observe/proxy/health {
        access_log off;
        return 200 '{"status":"ok","service":"r-observe-proxy"}';
        add_header Content-Type application/json;
    }

    # Redireciona raiz para a página principal com os 4 cards
    location = / {
        return 302 /observe/settings;
    }

    location / {
        return 404;
    }
}
