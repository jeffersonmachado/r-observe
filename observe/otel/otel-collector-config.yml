receivers:
  # ── OTLP: traces, métricas e logs via SDK ──────────────────────────────────
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Nota: filelog receiver removido — requer privilégios root para acessar
  # /var/lib/docker/containers. Logs chegam via OTLP SDK dos próprios serviços.

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

  memory_limiter:
    limit_mib: 128
    spike_limit_mib: 32
    check_interval: 5s

  resource:
    attributes:
      - key: product
        value: r-observe
        action: insert


exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: r_observe

  # Loki 3 recebe logs OTLP nativamente; o exporter Loki legado foi removido.
  otlp_http/loki:
    endpoint: "http://r-observe-loki:3100/otlp"
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    # Traces removidos: não há backend de traces (só debug/stderr), e os
    # serviços usam amostragem mínima (2%) — sem pipeline, spans são descartados.

    # Métricas via OTLP SDK
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

    # Logs via OTLP SDK
    logs/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/loki]


  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
